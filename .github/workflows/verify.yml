name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Branch pushes and PR synchronize events share one validation run.
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s scripts/tests -p 'test_package_android.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked && python3 scripts/verify-processes.py
      - run: cargo run --release --locked --bin mesh-sim
  android:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: android-actions/setup-android@v4.0.4
        with:
          # Keep the package list explicit; the retired "tools" package is not needed.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build-android.sh
      - run: cd android && ./gradlew testDebugUnitTest lintDebug
      - name: Verify APK signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package current APK with source identity
        id: package
        run: python3 scripts/package-android.py
      - name: Save Android delivery
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: android-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Link Android download and provenance
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          info = json.loads(Path('android-delivery/build-info.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"[Download Android APK + SHA-256 + provenance]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write(f"Version: {info['versionName']} / {info['versionCode']}\n\nCommit: `{info['sourceCommit']}`\n\n")
              summary.write('ARM64 debug build. Check all Verify jobs before testing. Artifacts retained 30 days.\n')
          PYTHON
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: brew install xcodegen
      - name: Build iPhone simulator app
        run: ./scripts/build-ios.sh --simulator
  ios-ui:
    # Native Apple Silicon keeps simulator startup and XCTest execution practical.
    # The device IPA and Intel compilation checks retain their existing runners.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build app and UI test harness before booting simulator
        run: |
          ./scripts/build-ios.sh --simulator
          ./scripts/test-ios.sh --build-tests
      - name: Boot iPhone simulator and run personal-use tests
        # Hosted simulator cold launch can exceed ten minutes before XCTest starts.
        # Keep individual test limits at 300 seconds; allow all three cases to run.
        timeout-minutes: 25
        run: ./scripts/test-ios.sh --skip-build
      - name: Upload concise UI report and screenshots
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-personal-use-report
          path: |
            ios/build/personal-use-summary.json
            ios/build/personal-use-tests.log
            ios/build/screenshots/*.png
            ios/build/screenshots/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-personal-use-tests
          path: |
            ios/build/PersonalUse-*.xcresult
            ios/build/personal-use-tests.log
            ios/build/prepare-tests.log
            ios/build/simulators.json
            ios/build/personal-use-summary.json
            ios/build/screenshots/
          if-no-files-found: warn
          retention-days: 14

  android-release:
    # A platform-prefixed tag avoids confusing Android alpha-0.3.0 with iOS versions.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-alpha-')
    needs: [core, android, ios, ios-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: android-delivery
      - name: Check downloaded package and tag provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify-android-delivery.py android-delivery
      - name: Create Android draft prerelease with this run's exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Refuse replacement, including on retries; never clobber historical assets.
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq -- "$RELEASE_TAG"; then
            echo "Release already exists; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" android-delivery/* \
            --verify-tag --draft --prerelease --title "Campus Mesh Android $RELEASE_TAG" \
            --notes-file android-delivery/README.txt
