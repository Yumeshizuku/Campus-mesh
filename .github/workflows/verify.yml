name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked && python3 scripts/verify-processes.py
      - run: cargo run --release --locked --bin mesh-sim
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: android-actions/setup-android@v4.0.4
        with:
          # Keep the package list explicit; the retired "tools" package is not needed.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build-android.sh
      - run: cd android && ./gradlew lintDebug
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: brew install xcodegen
      - name: Build and run iPhone simulator tests
        run: ./scripts/test-ios.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-personal-use-tests
          path: |
            ios/build/PersonalUse-*.xcresult
            ios/build/personal-use-tests.log
            ios/build/simulators.json
          if-no-files-found: warn
          retention-days: 14
