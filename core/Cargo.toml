[package]
name = "campus-mesh"
version = "0.1.0"
edition = "2021"
[lib]
name = "campus_mesh"
crate-type = ["rlib", "staticlib", "cdylib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
fs2 = "0.4"
